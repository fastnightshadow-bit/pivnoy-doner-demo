<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#ffffff" />
    <title>Пивной Донер — Владелец</title>
    <link rel="manifest" href="owner.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/app/favicon-32.png" />
    <link rel="apple-touch-icon" href="assets/app/apple-touch-icon.png" />
    <link rel="stylesheet" href="owner.css" />
    <script type="module" src="owner.js"></script>
  </head>
  <body>
    <section class="owner-login" data-owner-login>
      <form class="owner-login__card" data-owner-login-form>
        <img src="assets/mobile-home/logo-transparent.webp" alt="" />
        <span>Пивной Донер</span>
        <h1>Вход владельца</h1>
        <p>Введите личный PIN</p>
        <label>
          <span>PIN</span>
          <input data-owner-pin inputmode="numeric" autocomplete="one-time-code" maxlength="12" required />
        </label>
        <p class="owner-error" data-owner-login-error hidden></p>
        <button type="submit">Войти</button>
      </form>
    </section>

    <div class="owner-app" data-owner-app hidden>
      <header class="owner-header">
        <div class="owner-brand">
          <img src="assets/mobile-home/logo-transparent.webp" alt="" />
          <div><strong>Пивной Донер</strong><span>Панель владельца</span></div>
        </div>
        <div class="owner-header__actions">
          <button class="owner-button owner-button--light" data-owner-refresh>Обновить</button>
          <button class="owner-button owner-button--light" data-owner-logout>Выйти</button>
        </div>
      </header>

      <main class="owner-main">
        <section class="owner-title">
          <div><span>Текущая смена</span><h1>Контроль ресторана</h1></div>
          <label class="owner-accepting">
            <span><strong>Приём заказов</strong><small data-owner-accepting-label>Включён</small></span>
            <input type="checkbox" data-owner-accepting />
            <i aria-hidden="true"></i>
          </label>
        </section>

        <section class="owner-stats" aria-label="Показатели смены">
          <article><span>Активные заказы</span><strong data-owner-active>0</strong></article>
          <article><span>Просроченные</span><strong data-owner-overdue>0</strong></article>
          <article><span>Выручка сегодня</span><strong data-owner-revenue>0 ₽</strong></article>
        </section>

        <div class="owner-grid">
          <section class="owner-panel">
            <header><div><span>Меню</span><h2>Стоп-лист</h2></div><small>Цены здесь не меняются</small></header>
            <div class="owner-products" data-owner-products></div>
          </section>

          <aside class="owner-panel owner-links">
            <header><div><span>Рабочие экраны</span><h2>Быстрый доступ</h2></div></header>
            <a href="kitchen.html"><strong>Кухня</strong><span>Заказы и готовность →</span></a>
            <a href="courier.html"><strong>Курьер</strong><span>Доставки и контакты →</span></a>
          </aside>
        </div>
        <p class="owner-toast" data-owner-toast hidden></p>
      </main>
    </div>
  </body>
</html>

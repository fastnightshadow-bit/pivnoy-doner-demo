<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Статус заказа — Пивной Донер</title>
    <link rel="stylesheet" href="motion.css" />
    <link rel="stylesheet" href="order.css" />
  </head>
  <body>
    <svg class="order-sprite" aria-hidden="true">
      <symbol id="order-i-arrow-left" viewBox="0 0 24 24">
        <path d="m15 18-6-6 6-6" />
      </symbol>
      <symbol id="order-i-check" viewBox="0 0 24 24">
        <path d="m5 12 4 4L19 6" />
      </symbol>
      <symbol id="order-i-alert" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7v6M12 17h.01" />
      </symbol>
      <symbol id="order-i-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7v5l3 2" />
      </symbol>
      <symbol id="order-i-location" viewBox="0 0 24 24">
        <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z" />
        <circle cx="12" cy="10" r="2.5" />
      </symbol>
      <symbol id="order-i-phone" viewBox="0 0 24 24">
        <path
          d="M7 3H4a1 1 0 0 0-1 1c0 9.4 7.6 17 17 17a1 1 0 0 0 1-1v-3l-4-1-1.5 2a15 15 0 0 1-9.5-9.5L8 7 7 3Z"
        />
      </symbol>
      <symbol id="order-i-chevron" viewBox="0 0 24 24">
        <path d="m8 10 4 4 4-4" />
      </symbol>
    </svg>

    <div class="order-app">
      <header class="order-header">
        <a
          class="order-back"
          href="home.html"
          aria-label="Вернуться на главную"
          data-order-home
        >
          <svg class="order-icon" aria-hidden="true">
            <use href="#order-i-arrow-left"></use>
          </svg>
        </a>
      </header>

      <main class="order-main" data-order-screen hidden>
        <div class="order-status-column">
        <section
          class="order-confirmation"
          aria-labelledby="order-title"
          data-order-tone="neutral"
        >
          <span class="order-confirmation__icon" aria-hidden="true">
            <svg class="order-icon">
              <use href="#order-i-check" data-order-status-icon></use>
            </svg>
          </span>
          <p class="order-number">
            Заказ <strong data-order-number></strong>
          </p>
          <h1 id="order-title" data-order-title>Заказ оформлен</h1>
          <p class="order-message" data-order-message></p>
          <p class="order-eta" data-order-eta></p>
        </section>

        <ol
          class="order-progress"
          data-order-progress
          aria-label="Статус заказа"
        ></ol>

        </div>
        <div class="order-info-column">

        <section class="order-card order-details-card">
          <button
            class="order-details-toggle"
            type="button"
            aria-expanded="false"
            data-order-details-toggle
          >
            <span>Посмотреть состав заказа</span>
            <svg class="order-icon" aria-hidden="true">
              <use href="#order-i-chevron"></use>
            </svg>
          </button>
          <div class="order-details" data-order-details hidden>
            <div class="order-items" data-order-items></div>
            <dl class="order-summary" data-order-summary></dl>
          </div>
        </section>

        <section class="order-card order-context" data-order-context></section>

        <footer class="order-actions" data-order-actions hidden>
          <a
            class="order-button order-button--secondary"
            href="tel:"
            data-order-contact
            hidden
          >
            Связаться с рестораном
          </a>
          <a
            class="order-button order-button--primary"
            href="home.html"
            data-order-home
          >
            На главную
          </a>
          <a
            class="order-button order-button--primary"
            href="checkout.html"
            data-order-retry
            hidden
          >
            Повторить оплату
          </a>
        </footer>
        </div>
      </main>

      <section class="order-empty" data-order-empty hidden>
        <span class="order-empty__icon" aria-hidden="true">
          <svg class="order-icon">
            <use href="#order-i-clock"></use>
          </svg>
        </span>
        <h1>Заказ не найден</h1>
        <p>Вернитесь в меню и оформите новый заказ.</p>
        <a class="order-button order-button--primary" href="home.html">
          На главную
        </a>
      </section>

    </div>

    <script type="module" src="motion.js"></script>
    <script type="module" src="order.js"></script>
  </body>
</html>

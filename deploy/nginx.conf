map $host $app_entry {
  ~^kitchen\.pivdoner\.ru$ /kitchen.html;
  ~^courier\.pivdoner\.ru$ /courier.html;
  ~^owner\.pivdoner\.ru$ /owner.html;
  default /home.html;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  charset utf-8;

  location = / {
    try_files $app_entry =404;
  }

  location / {
    try_files $uri $app_entry;
  }

  location ~* \.(?:css|js|png|jpg|jpeg|webp|svg|woff2)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:html|webmanifest)$ {
    add_header Cache-Control "no-cache";
    try_files $uri $app_entry;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}

map $host $app_entry {
  ~^kitchen\.pivdoner\.ru$ /kitchen.html;
  ~^courier\.pivdoner\.ru$ /courier.html;
  ~^owner\.pivdoner\.ru$ /owner.html;
  default /home.html;
}

map $host $robots_entry {
  ~^pivdoner\.ru$ /robots.txt;
  ~^www\.pivdoner\.ru$ /robots.txt;
  default /robots-private.txt;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  charset utf-8;

  include /etc/nginx/security-headers.conf;

  location = / {
    try_files $app_entry =404;
  }

  location = /robots.txt {
    default_type text/plain;
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
    try_files $robots_entry =404;
  }

  location = /sitemap.xml {
    default_type application/xml;
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  location / {
    try_files $uri $app_entry;
  }

  location ~* -sw\.js$ {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  location ~* \.(?:css|js|png|jpg|jpeg|webp|svg|woff2)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  location ~* \.webmanifest$ {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  location ~* \.html$ {
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
    try_files $uri $app_entry;
  }
}

<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Корзина мобильного приложения «Пивной Донер»."
    />
    <meta name="theme-color" content="#FFFFFF" />
    <title>Корзина — Пивной Донер</title>
    <link rel="manifest" href="client.webmanifest?v=20260805" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/app/favicon-32.png?v=20260805" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/app/apple-touch-icon.png?v=20260805" />
    <script src="theme-preload.js"></script>
    <link rel="stylesheet" href="motion.css" />
    <link rel="stylesheet" href="cart.css" />
    <link rel="stylesheet" href="client-theme.css?v=2026081301" />
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="cart-i-back" viewBox="0 0 24 24">
        <path d="m15 6-6 6 6 6" />
      </symbol>
      <symbol id="cart-i-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" />
      </symbol>
      <symbol id="cart-i-minus" viewBox="0 0 24 24">
        <path d="M5 12h14" />
      </symbol>
      <symbol id="cart-i-bag" viewBox="0 0 24 24">
        <path d="M6 8h12l1 12H5L6 8Z" /><path d="M9 8a3 3 0 0 1 6 0" />
      </symbol>
      <symbol id="cart-i-wrap" viewBox="0 0 24 24">
        <path d="m7 4 10 2 2 14-12-2L5 7l2-3Z" />
        <path d="m6 8 12 2M8 12l9 2" />
      </symbol>
      <symbol id="cart-i-fries" viewBox="0 0 24 24">
        <path d="M7 4v7M11 3v8M15 4v7M18 5l-1 6" />
        <path d="M5 10h14l-2 10H7L5 10Z" />
      </symbol>
      <symbol id="cart-i-bites" viewBox="0 0 24 24">
        <path d="M7 7c2-2 5-1 5 2 0 2-1 4-3 5-2 1-5-1-5-3 0-1 1-3 3-4Z" />
        <path d="M15 10c2-1 5 1 5 3 0 3-3 5-5 5-3 0-4-3-3-5 0-1 1-2 3-3Z" />
      </symbol>
      <symbol id="cart-i-cheese" viewBox="0 0 24 24">
        <path d="M4 9 15 4l5 5v10H4V9Z" />
        <circle cx="10" cy="12" r="1.5" /><circle cx="16" cy="15" r="1.5" />
      </symbol>
    </svg>

    <div class="cart-app">
      <header class="cart-header">
        <a class="cart-header__back" href="home.html" aria-label="Вернуться назад" data-motion-back>
          <svg class="icon"><use href="#cart-i-back"></use></svg>
        </a>
        <div>
          <h1>Корзина</h1>
          <p data-cart-count-label>0 товаров</p>
        </div>
        <span aria-hidden="true"></span>
      </header>

      <main class="cart-main">
        <div data-filled-cart>
          <section class="cart-lines" aria-label="Товары в корзине" data-cart-lines></section>

          <section class="cart-recommendations" aria-labelledby="recommendations-title">
            <header>
              <span>Можно добавить</span>
              <h2 id="recommendations-title">Часто добавляют</h2>
            </header>
            <div class="recommendation-list" data-recommendations></div>
          </section>

          <section class="cart-summary" aria-labelledby="summary-title">
            <h2 id="summary-title">Ваш заказ</h2>
            <dl>
              <div><dt>Товары</dt><dd data-items-total>0 ₽</dd></div>
              <div><dt data-delivery-label>Самовывоз</dt><dd data-delivery-total>0 ₽</dd></div>
              <div class="cart-summary__total">
                <dt>Итого</dt>
                <dd aria-live="polite" data-grand-total>0 ₽</dd>
              </div>
            </dl>
          </section>
        </div>

        <section class="empty-cart" hidden data-empty-cart>
          <div class="empty-cart__illustration" aria-hidden="true">
            <svg class="icon"><use href="#cart-i-bag"></use></svg>
          </div>
          <h2>В корзине пока пусто</h2>
          <p>Добавьте блюда из меню — всё появится здесь</p>
          <a href="home.html#categories">Перейти в меню</a>
        </section>
      </main>

      <nav class="client-footer__legal" aria-label="Правовая информация">
        <a href="seller.html">Продавец</a>
        <a href="offer.html">Оферта</a>
        <a href="privacy.html">Политика данных</a>
        <a href="consent.html">Согласие</a>
      </nav>

      <aside class="cart-checkout" data-checkout-bar>
        <p class="cart-checkout__fulfillment" data-cart-fulfillment>Самовывоз</p>
        <div>
          <span>Итого</span>
          <strong aria-live="polite" data-checkout-total>0 ₽</strong>
        </div>
        <a href="checkout.html" data-checkout>Перейти к оформлению</a>
      </aside>
    </div>

    <div class="cart-toast" role="status" aria-live="polite" data-cart-toast></div>
    <script type="module" src="theme.js"></script>
    <script type="module" src="motion.js"></script>
    <script type="module" src="cart.js"></script>
  </body>
</html>
